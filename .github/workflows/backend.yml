name: Backend checks

on:
  push:
    paths: ["backend/**", ".github/workflows/backend.yml"]
  pull_request:
    paths: ["backend/**", ".github/workflows/backend.yml"]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_DB: aspa_test
          POSTGRES_USER: aspa
          POSTGRES_PASSWORD: aspa
        ports: ["55432:5432"]
        options: >-
          --health-cmd "pg_isready -U aspa -d aspa_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8.10.1-alpine
        ports: ["56379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://aspa:aspa@127.0.0.1:55432/aspa_test
      TEST_REDIS_URL: redis://127.0.0.1:56379/0
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.16"
          python-version: "3.14.7"
      - run: uv sync --locked
      - run: uv run --locked ruff check .
      - run: uv run --locked ruff format --check .
      - run: uv run --locked pyright
      - run: uv run --locked pytest
      - run: docker build --tag aspa-backend:ci .
