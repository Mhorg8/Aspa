name: aspa-tests
services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: aspa_test
      POSTGRES_USER: aspa
      POSTGRES_PASSWORD: aspa
    ports:
      - "127.0.0.1:55432:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aspa -d aspa_test"]
      interval: 2s
      timeout: 5s
      retries: 15
  redis:
    image: redis:8.10.1-alpine
    ports:
      - "127.0.0.1:56379:6379"
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 15
